name: Deploy

on:
  workflow_dispatch:
  # A Sanity webhook POSTs {"event_type":"sanity-content-published"} to
  # /repos/fernandojne20/photo-studio/dispatches when an editor publishes.
  repository_dispatch:
    types: [sanity-content-published]
  # A merged pull request already passed CI.
  push:
    branches:
      - main

permissions:
  contents: read

# Never in parallel, and a running deploy is never cancelled. GitHub keeps at
# most one run waiting in the group: a newer one replaces it, which is fine
# because every run builds the latest `main`.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # `secrets` cannot be read in a job-level `if:`, so this job maps them to
  # env and publishes a plain output the deploy job can test.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      # Only `main` is ever deployed: "Run workflow" lets anyone pick a
      # branch, and push/repository_dispatch already run on `main`.
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped: only main is deployed, this run is on $REF."
          elif [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deploy skipped until both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set as repository secrets."
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the v6.1.0 commit; tags are mutable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Strict content: no CONTENT_FALLBACKS, so a Sanity error or missing
      # content fails the build instead of shipping placeholders. These are
      # Actions variables, not secrets: every value is inlined in public JS.
      - run: pnpm build
        env:
          PUBLIC_SANITY_PROJECT_ID: r781btme
          PUBLIC_SANITY_DATASET: production
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.PUBLIC_TURNSTILE_SITE_KEY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
      # Indexable only once PUBLIC_SITE_URL is set (custom domain); on
      # workers.dev it stays unset and the build is non-indexable. A content
      # change (repository_dispatch) only REPORTS budgets: editor text has no
      # maximum, so nobody could act on a size failure. Every other check
      # still fails the run; push and manual deploys enforce budgets.
      - name: Verify the build
        env:
          SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          budgets=enforce
          if [ "$EVENT_NAME" = "repository_dispatch" ]; then budgets=report; fi
          if [ -n "$SITE_URL" ]; then
            PUBLIC_SITE_URL="$SITE_URL" pnpm build:verify --mode=indexable --origin="$SITE_URL" --budgets="$budgets"
          else
            pnpm build:verify --mode=non-indexable --budgets="$budgets"
          fi
      # The lockfile's Wrangler, not a third-party action. Credentials are
      # scoped to this step only.
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
