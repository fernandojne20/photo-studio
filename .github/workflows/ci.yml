name: CI

on:
  # No base-branch filter: stacked pull requests target other feature
  # branches and must be validated too.
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PUBLIC_SANITY_PROJECT_ID: r781btme
  PUBLIC_SANITY_DATASET: production

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the v6.1.0 commit; tags are mutable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm --filter studio lint
      - run: pnpm --filter studio format:check

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the v6.1.0 commit; tags are mutable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter studio typecheck
      - run: pnpm typegen:check

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the v6.1.0 commit; tags are mutable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CONTENT_FALLBACKS: 'true'
      # PD-06: this build is already non-indexable (no PUBLIC_SITE_URL), so
      # its own verification runs right here instead of building it again
      # in the `verify` job below.
      - run: pnpm build:verify --mode=non-indexable
      - run: pnpm studio:build

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the v6.1.0 commit; tags are mutable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # PD-06: the indexable build and its verification. Non-indexable is
  # already covered by the `build` job above, right after its own build —
  # this job never repeats that one, only the indexable mode.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Third-party action pinned to the v6.1.0 commit; tags are mutable.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CONTENT_FALLBACKS: 'true'
          PUBLIC_SITE_URL: https://www.example.com
      - run: pnpm build:verify --mode=indexable --origin=https://www.example.com
